spring.application.name=grad

# Authentication uses the database login service and bearer JWTs; disable the generated development user.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Load developer-specific secrets from the project root when present.
# Environment variables with the same names take precedence.
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST:${supabase.db.host}}:${SUPABASE_DB_PORT:${supabase.db.port:5432}}/${SUPABASE_DB_NAME:${supabase.db.name}}?sslmode=require
spring.datasource.username=${SUPABASE_DB_USERNAME:${supabase.db.username}}
spring.datasource.password=${SUPABASE_DB_PASSWORD:${supabase.db.password}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# The signing secret is supplied only by application-local.properties.
security.jwt.issuer=nilex-api
security.jwt.audience=nilex-client
security.jwt.access-token-ttl=PT30M

# Flyway owns schema changes; Hibernate only verifies that mappings match them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true

# Reject unexpected request fields (for example, a client-supplied role).
spring.jackson.deserialization.fail-on-unknown-properties=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=false

# Hibernate's INFO-level database summary can include the JDBC host.
logging.level.org.hibernate.orm.connections.pooling=warn
logging.level.org.flywaydb.core=warn
logging.level.org.springframework.web=info

